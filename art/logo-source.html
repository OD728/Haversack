<!doctype html>
<html><head><meta charset="utf-8"><title>Haversack logo (Paint style)</title>
<style>html,body{margin:0;background:#16162a}canvas{display:block}</style></head>
<body><canvas id="c" width="512" height="512"></canvas>
<script>
// Haversack logo, drawn like a kid did it in MS Paint.
// Seeded random so every render gives the same picture.

let seed = 53;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function jit(n) { return (rnd() - 0.5) * 2 * n; }

const c = document.getElementById('c');
const g = c.getContext('2d');
const BG = '#16162a', INK = '#fff';
const used = new Set([BG, INK, '#000']);
g.fillStyle = BG; g.fillRect(0, 0, 512, 512);
g.lineCap = 'round'; g.lineJoin = 'round';

// A shaky line through points: each segment is cut into little steps that wander.
function shakyPath(pts, wob, closed) {
  const p = closed ? pts.concat([pts[0]]) : pts;
  g.beginPath();
  g.moveTo(p[0][0] + jit(wob), p[0][1] + jit(wob));
  for (let i = 1; i < p.length; i++) {
    const [ax, ay] = p[i - 1], [bx, by] = p[i];
    const steps = Math.max(2, Math.round(Math.hypot(bx - ax, by - ay) / 18));
    for (let s = 1; s <= steps; s++) {
      const t = s / steps;
      g.lineTo(ax + (bx - ax) * t + jit(wob), ay + (by - ay) * t + jit(wob));
    }
  }
}
function stroke(pts, color, width, wob, closed) {
  used.add(color); g.strokeStyle = color; g.lineWidth = width;
  shakyPath(pts, wob, closed); g.stroke();
}
// "Paint bucket": fill slightly off from the outline, so it leaks and misses.
function sloppyFill(pts, color, dx, dy) {
  used.add(color); g.fillStyle = color;
  shakyPath(pts.map(([x, y]) => [x + dx, y + dy]), 5, true); g.fill();
}
// Fill + white outline in one go.
function shape(pts, fill, off, width) {
  sloppyFill(pts, fill, off[0], off[1]);
  stroke(pts, INK, width || 7, 4, true);
}
function circle(cx, cy, r, n) {
  const pts = []; n = n || 14;
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
function poly(cx, cy, r, n, rot) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = rot + i / n * Math.PI * 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
function rect(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
function star(cx, cy, r1, r2) {
  const pts = [];
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? r2 : r1; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
// Big wobbly "handwriting".
function scrawl(text, x, y, size, color) {
  used.add(color); g.fillStyle = color;
  g.font = 'bold ' + size + 'px "Comic Sans MS", cursive';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  let cx = x - g.measureText(text).width / 2;
  for (const ch of text) {
    const w = g.measureText(ch).width;
    g.save(); g.translate(cx + w / 2, y + jit(4)); g.rotate(jit(0.12)); g.fillText(ch, 0, 0); g.restore();
    cx += w;
  }
}


// A big round sack tied with a rope.
const sack = [[190,150],[322,150],[350,190],[420,250],[452,340],[436,420],[380,466],[256,480],[132,466],[76,420],[60,340],[92,250],[162,190]];
shape(sack, '#a0642a', [7, 6], 8);
const neck = [[180,150],[150,96],[196,72],[256,90],[316,72],[362,96],[332,150]];
shape(neck, '#b8763a', [-5, 4], 7);
used.add('#4a2a10');
stroke([[200,262],[226,330]], '#4a2a10', 5, 3); stroke([[300,300],[330,360]], '#4a2a10', 5, 3); stroke([[150,380],[180,420]], '#4a2a10', 5, 3);
stroke([[170,150],[256,170],[342,150]], '#f0c070', 12, 3);
shape(circle(256, 166, 18, 9), '#f0c070', [2, 2], 5);
stroke([[256,180],[300,232],[322,260]], '#f0c070', 10, 3);
stroke([[262,182],[278,240],[270,276]], '#f0c070', 10, 3);


// MS Paint has no smoothing: snap every pixel to the nearest color this page used.
const palette = [...used].map(h => [1, 3, 5].map(i => parseInt(h.length === 4 ? h[(i + 1) / 2].repeat(2) : h.substr(i, 2), 16)));
const img = g.getImageData(0, 0, 512, 512), d = img.data;
for (let i = 0; i < d.length; i += 4) {
  let best = palette[0], bd = 1e9;
  for (const p of palette) {
    const dd = (d[i]-p[0])**2 + (d[i+1]-p[1])**2 + (d[i+2]-p[2])**2;
    if (dd < bd) { bd = dd; best = p; }
  }
  d[i] = best[0]; d[i+1] = best[1]; d[i+2] = best[2]; d[i+3] = 255;
}
g.putImageData(img, 0, 0);

</script></body></html>
