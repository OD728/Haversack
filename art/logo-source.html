<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="512" height="512"></canvas>
<script>
// Haversack logo: a leather satchel carrying the addon's square slots
// (thin frame in quest yellow / uncommon / rare / epic, soft shadow).
const c = document.getElementById('c');
const g = c.getContext('2d');
const W = 512;

// warm dark background
let bg = g.createRadialGradient(256, 250, 20, 256, 256, 380);
bg.addColorStop(0, '#3a2414');
bg.addColorStop(0.55, '#1a100a');
bg.addColorStop(1, '#080504');
g.fillStyle = bg;
g.fillRect(0, 0, W, W);

function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function leather(y0, y1, light, dark) {
  let l = g.createLinearGradient(0, y0, 0, y1);
  l.addColorStop(0, light); l.addColorStop(1, dark);
  return l;
}

// strap: an arc over the bag
g.lineCap = 'round';
g.strokeStyle = '#000'; g.lineWidth = 34;
g.beginPath(); g.arc(256, 196, 128, Math.PI * 1.08, Math.PI * 1.92); g.stroke();
g.strokeStyle = leather(60, 200, '#9a6232', '#5a3418'); g.lineWidth = 24;
g.beginPath(); g.arc(256, 196, 128, Math.PI * 1.08, Math.PI * 1.92); g.stroke();
g.strokeStyle = 'rgba(255,220,170,0.25)'; g.lineWidth = 2; g.setLineDash([7, 7]);
g.beginPath(); g.arc(256, 196, 128, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
g.setLineDash([]);

// bag body with a soft drop shadow
const BX = 96, BY = 160, BW = 320, BH = 270;
g.save();
g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = 30; g.shadowOffsetY = 10;
g.fillStyle = '#000'; rr(BX - 5, BY - 5, BW + 10, BH + 10, 34); g.fill();
g.restore();
g.fillStyle = leather(BY, BY + BH, '#8a5428', '#4a2a12');
rr(BX, BY, BW, BH, 30); g.fill();
// stitching along the body
g.strokeStyle = 'rgba(255,220,170,0.28)'; g.lineWidth = 2; g.setLineDash([8, 7]);
rr(BX + 12, BY + 12, BW - 24, BH - 24, 22); g.stroke();
g.setLineDash([]);

// the addon's slots on the front: 2 x 2 square slots
const S = 66, GAP = 16;
const GX = 256 - S - GAP / 2, GY = 270;
const frames = ['#ffcc00', '#1eff00', '#0070dd', '#a335ee'];   // quest, uncommon, rare, epic
const fills = [
  ['#7a5a1a', '#2a1c08'], ['#2f6a2a', '#0d220c'],
  ['#28507a', '#0a1828'], ['#5a2a7a', '#1c0a28'],
];
frames.forEach((col, i) => {
  const x = GX + (i % 2) * (S + GAP), y = GY + Math.floor(i / 2) * (S + GAP);
  // soft shadow (three stacked squares, like in the addon)
  [[3, 0.35], [6, 0.2], [9, 0.1]].forEach(([d, a]) => {
    g.fillStyle = `rgba(0,0,0,${a})`; g.fillRect(x - d, y - d, S + 2 * d, S + 2 * d);
  });
  g.fillStyle = '#000'; g.fillRect(x, y, S, S);              // black edge
  g.fillStyle = col; g.fillRect(x + 3, y + 3, S - 6, S - 6);  // rarity frame
  g.fillStyle = '#000'; g.fillRect(x + 7, y + 7, S - 14, S - 14);
  let ic = g.createLinearGradient(x, y, x + S, y + S);       // "icon"
  ic.addColorStop(0, fills[i][0]); ic.addColorStop(1, fills[i][1]);
  g.fillStyle = ic; g.fillRect(x + 9, y + 9, S - 18, S - 18);
  let sh = g.createLinearGradient(0, y + 9, 0, y + S - 9);   // a little shine
  sh.addColorStop(0, 'rgba(255,255,255,0.22)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)');
  g.fillStyle = sh; g.fillRect(x + 9, y + 9, S - 18, S - 18);
});

// flap over the top of the bag, rounded at the bottom
const FY = BY, FH = 92;
g.save();
g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 16; g.shadowOffsetY = 6;
g.fillStyle = leather(FY, FY + FH, '#a3683a', '#6a3e1c');
g.beginPath();
g.moveTo(BX + 30, FY);
g.lineTo(BX + BW - 30, FY);
g.arcTo(BX + BW, FY, BX + BW, FY + 30, 30);
g.lineTo(BX + BW, FY + FH - 40);
g.quadraticCurveTo(256, FY + FH + 26, BX, FY + FH - 40);
g.lineTo(BX, FY + 30);
g.arcTo(BX, FY, BX + 30, FY, 30);
g.closePath(); g.fill();
g.restore();
g.strokeStyle = 'rgba(255,220,170,0.3)'; g.lineWidth = 2; g.setLineDash([8, 7]);
g.beginPath();
g.moveTo(BX + 14, FY + 30); g.lineTo(BX + 14, FY + FH - 44);
g.quadraticCurveTo(256, FY + FH + 12, BX + BW - 14, FY + FH - 44);
g.lineTo(BX + BW - 14, FY + 30);
g.stroke(); g.setLineDash([]);

// gold buckle
const KX = 256, KY = FY + FH - 6;
g.fillStyle = '#000'; rr(KX - 26, KY - 20, 52, 40, 7); g.fill();
let gold = g.createLinearGradient(0, KY - 18, 0, KY + 18);
gold.addColorStop(0, '#f2cc66'); gold.addColorStop(1, '#8c661f');
g.fillStyle = gold; rr(KX - 23, KY - 17, 46, 34, 5); g.fill();
g.fillStyle = '#3a2410'; rr(KX - 13, KY - 8, 26, 16, 3); g.fill();
g.fillStyle = gold; g.fillRect(KX - 2, KY - 8, 4, 16);
</script>
</body></html>
