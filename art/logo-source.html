<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="512" height="512"></canvas>
<script>
// Haversack logo: a round sack tied with a rope, carrying the addon's square
// slots (thin frame in quest yellow / uncommon / rare / epic, soft shadow).
const c = document.getElementById('c');
const g = c.getContext('2d');
const W = 512;

// warm dark background
let bg = g.createRadialGradient(256, 270, 20, 256, 256, 380);
bg.addColorStop(0, '#3a2414');
bg.addColorStop(0.55, '#1a100a');
bg.addColorStop(1, '#080504');
g.fillStyle = bg;
g.fillRect(0, 0, W, W);

// ---- sack shapes -------------------------------------------------------
const NECK_Y = 168, NECK_W = 64;   // half width of the tied neck

function bodyPath() {               // round belly below the neck
  g.beginPath();
  g.moveTo(256 - NECK_W, NECK_Y);
  g.bezierCurveTo(256 - 120, NECK_Y + 30, 256 - 186, NECK_Y + 90, 256 - 180, NECK_Y + 170);
  g.bezierCurveTo(256 - 174, NECK_Y + 250, 256 - 110, NECK_Y + 274, 256, NECK_Y + 274);
  g.bezierCurveTo(256 + 110, NECK_Y + 274, 256 + 174, NECK_Y + 250, 256 + 180, NECK_Y + 170);
  g.bezierCurveTo(256 + 186, NECK_Y + 90, 256 + 120, NECK_Y + 30, 256 + NECK_W, NECK_Y);
  g.closePath();
}

function topPath() {                // ruffled opening above the neck
  g.beginPath();
  g.moveTo(256 - NECK_W + 6, NECK_Y + 4);
  g.bezierCurveTo(256 - 90, NECK_Y - 40, 256 - 120, NECK_Y - 70, 256 - 104, NECK_Y - 92);
  // wavy rim
  const pts = [[-104, -92], [-70, -78], [-44, -100], [-12, -80], [18, -104], [48, -82], [78, -100], [106, -86]];
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    g.quadraticCurveTo(256 + (x0 + x1) / 2, NECK_Y + Math.min(y0, y1) - 12, 256 + x1, NECK_Y + y1);
  }
  g.bezierCurveTo(256 + 120, NECK_Y - 66, 256 + 90, NECK_Y - 40, 256 + NECK_W - 6, NECK_Y + 4);
  g.closePath();
}

function burlap(x0, y0, x1, y1) {   // faint woven texture inside the current clip
  g.strokeStyle = 'rgba(0,0,0,0.10)'; g.lineWidth = 1;
  for (let y = y0; y < y1; y += 6) { g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke(); }
  g.strokeStyle = 'rgba(255,230,190,0.05)';
  for (let x = x0; x < x1; x += 6) { g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke(); }
}

// body: shadow, black outline, leather/burlap fill, shading
g.save();
g.shadowColor = 'rgba(0,0,0,0.75)'; g.shadowBlur = 34; g.shadowOffsetY = 12;
g.fillStyle = '#000'; bodyPath(); g.fill();
g.restore();
g.lineWidth = 10; g.strokeStyle = '#000'; bodyPath(); g.stroke();
let bodyFill = g.createRadialGradient(220, 280, 30, 256, 320, 230);
bodyFill.addColorStop(0, '#9c6a38');
bodyFill.addColorStop(0.6, '#6e4520');
bodyFill.addColorStop(1, '#3c230e');
g.fillStyle = bodyFill; bodyPath(); g.fill();
g.save(); bodyPath(); g.clip();
burlap(60, NECK_Y, 452, NECK_Y + 290);
// folds running down from the neck
g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 3; g.lineCap = 'round';
[[-40, -110, 60], [-14, -40, 40], [14, 40, 40], [40, 110, 60]].forEach(([sx, ex, len]) => {
  g.beginPath(); g.moveTo(256 + sx, NECK_Y + 6);
  g.quadraticCurveTo(256 + (sx + ex) / 2, NECK_Y + len / 2, 256 + ex, NECK_Y + len); g.stroke();
});
g.restore();

// top ruffle
g.lineWidth = 10; g.strokeStyle = '#000'; topPath(); g.stroke();
g.fillStyle = (() => { let t = g.createLinearGradient(0, NECK_Y - 110, 0, NECK_Y);
  t.addColorStop(0, '#a87442'); t.addColorStop(1, '#5e3a1a'); return t; })();
topPath(); g.fill();
g.save(); topPath(); g.clip();
burlap(140, NECK_Y - 120, 372, NECK_Y + 10);
g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 3;
[-50, -18, 18, 50].forEach(x => { g.beginPath(); g.moveTo(256 + x * 0.5, NECK_Y); g.lineTo(256 + x, NECK_Y - 80); g.stroke(); });
g.restore();
// dark inside of the opening
g.fillStyle = 'rgba(20,10,4,0.85)';
g.beginPath(); g.ellipse(256, NECK_Y - 88, 70, 10, 0, 0, Math.PI * 2); g.fill();

// rope around the neck, with a knot and two hanging ends
function rope(path, w) {
  g.lineCap = 'round';
  g.strokeStyle = '#000'; g.lineWidth = w + 8; path(); g.stroke();
  g.strokeStyle = '#c9a25a'; g.lineWidth = w; path(); g.stroke();
  g.strokeStyle = 'rgba(90,60,20,0.8)'; g.lineWidth = 2; g.setLineDash([5, 6]); path(); g.stroke();
  g.setLineDash([]);
}
rope(() => { g.beginPath(); g.moveTo(256 - NECK_W - 6, NECK_Y + 2); g.quadraticCurveTo(256, NECK_Y + 22, 256 + NECK_W + 6, NECK_Y + 2); }, 14);
rope(() => { g.beginPath(); g.moveTo(268, NECK_Y + 12); g.bezierCurveTo(300, NECK_Y + 40, 296, NECK_Y + 70, 312, NECK_Y + 92); }, 9);
rope(() => { g.beginPath(); g.moveTo(276, NECK_Y + 12); g.bezierCurveTo(320, NECK_Y + 28, 334, NECK_Y + 54, 352, NECK_Y + 66); }, 9);
g.fillStyle = '#000'; g.beginPath(); g.arc(270, NECK_Y + 12, 15, 0, Math.PI * 2); g.fill();
g.fillStyle = '#d8b46a'; g.beginPath(); g.arc(270, NECK_Y + 12, 11, 0, Math.PI * 2); g.fill();

// ---- the addon's slots on the front: 2 x 2 ---------------------------------
const S = 60, GAP = 14;
const GX = 256 - S - GAP / 2, GY = 268;
const frames = ['#ffcc00', '#1eff00', '#0070dd', '#a335ee'];   // quest, uncommon, rare, epic
const fills = [
  ['#7a5a1a', '#2a1c08'], ['#2f6a2a', '#0d220c'],
  ['#28507a', '#0a1828'], ['#5a2a7a', '#1c0a28'],
];
frames.forEach((col, i) => {
  const x = GX + (i % 2) * (S + GAP), y = GY + Math.floor(i / 2) * (S + GAP);
  [[3, 0.35], [6, 0.2], [9, 0.1]].forEach(([d, a]) => {          // soft shadow
    g.fillStyle = `rgba(0,0,0,${a})`; g.fillRect(x - d, y - d, S + 2 * d, S + 2 * d);
  });
  g.fillStyle = '#000'; g.fillRect(x, y, S, S);                 // black edge
  g.fillStyle = col; g.fillRect(x + 3, y + 3, S - 6, S - 6);     // rarity frame
  g.fillStyle = '#000'; g.fillRect(x + 6, y + 6, S - 12, S - 12);
  let ic = g.createLinearGradient(x, y, x + S, y + S);          // "icon"
  ic.addColorStop(0, fills[i][0]); ic.addColorStop(1, fills[i][1]);
  g.fillStyle = ic; g.fillRect(x + 8, y + 8, S - 16, S - 16);
  let sh = g.createLinearGradient(0, y + 8, 0, y + S - 8);
  sh.addColorStop(0, 'rgba(255,255,255,0.22)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)');
  g.fillStyle = sh; g.fillRect(x + 8, y + 8, S - 16, S - 16);
});
</script>
</body></html>
